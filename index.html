<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;

  .summary-item .value.positive { color: #4caf50; }
  .summary-item .value.negative { color: #f44336; }
  .summary-item .value.neutral  { color: #f4c542; }

  .live-summary {
    display: flex;
    justify-content: center;
    gap: 16px;
    padding: 12px 20px;

    border-bottom: 1px solid #1a5c1a;

  .live-summary .ls-item {
    text-align: center;

  .live-summary .ls-item .ls-count {

  .ls-item.losing   { background: rgba(244,67,54,0.2); }

  .ls-item.tied     { background: rgba(255,152,0,0.2); }

  .ls-item.waiting  { background: rgba(255,255,255,0.05); }

  .container {

  .last-update {

    font-size: 0.7rem;

  .bet-card {
    background: #fff;

    border-radius: 10px;

  .bet-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 4px;
  }

  .bet-card .golfer-name {
    font-size: 1.15rem;

  .bet-card .bet-info {
    font-size: 0.78rem;

  .matchup-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    gap: 6px;

  .matchup-player {
    flex: 1;

  .matchup-player .mp-name {

  }

  .matchup-player .mp-score {

  }

  .matchup-player .mp-thru {
    font-size: 0.62rem;
    color: #999;
    margin-top: 1px;
  }

  .matchup-player .mp-score.winning { color: #2e7d32; }
  .matchup-player .mp-score.losing  { color: #c62828; }
  .matchup-player .mp-score.tied    { color: #f57f17; }

  .matchup-player .mp-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #999;
    letter-spacing: 0.5px;
  }

  .matchup-vs-badge {
    font-size: 0.7rem;
    font-weight: bold;
    color: #bbb;
    padding: 0 2px;
    flex-shrink: 0;
  }

  .bet-type-badge {
    display: inline-block;
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #fff;
    background: #0d4f0d;
    padding: 2px 8px;
    border-radius: 10px;
    margin-left: 6px;
    vertical-align: middle;
  }

  .bet-type-badge.total { background: #1565c0; }

  .total-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    align-items: center;
    padding: 10px 12px;
    gap: 6px;
    background: #f8f9fa;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    text-align: center;
  }

  .total-row .tr-block .tr-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #999;
    letter-spacing: 0.5px;
  }

  .total-row .tr-block .tr-value {
    font-size: 1.3rem;
    font-weight: bold;
    color: #333;
    margin-top: 2px;
  }

  .total-row .tr-block .tr-value.winning { color: #2e7d32; }
  .total-row .tr-block .tr-value.losing  { color: #c62828; }
  .total-row .tr-block .tr-value.tied    { color: #f57f17; }

  .total-row .tr-block .tr-sub {
    font-size: 0.62rem;
    color: #999;
    margin-top: 1px;
  }

  .bet-card .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    gap: 6px;
  }

  .status-bar.pending  { background: #f5f5f5; color: #757575; }
  .status-bar.won      { background: #4caf50; color: #fff; }
  .status-bar.lost     { background: #f44336; color: #fff; }
  .status-bar.push     { background: #ff9800; color: #fff; }
  .status-bar.not_started { background: #e3f2fd; color: #1565c0; }

  .status-bar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .status-bar.pending .status-dot    { background: #bbb; }
  .status-bar.won .status-dot        { background: #a5d6a7; }
  .status-bar.lost .status-dot       { background: #ef9a9a; }
  .status-bar.push .status-dot       { background: #ffe0b2; }
  .status-bar.not_started .status-dot { background: #90caf9; }

  .footer {
    text-align: center;
    padding: 20px;
    color: #5a8f5a;
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .summary-bar { gap: 16px; }
    .summary-item .value { font-size: 1.2rem; }
  }
</style>

<body>

<header>
  <h1>PGA Championship 2026</h1>
  <div class="subtitle">Round 3 Bets &mdash; Aronimink GC, Sat 5/16</div>
  <div class="live-badge disconnected" id="liveBadge">Connecting...</div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="label">Plays</div>
    <div class="value neutral" id="totalPlays">6</div>
  </div>
  <div class="summary-item">
    <div class="label">Total Risk</div>
    <div class="value neutral" id="totalRisk">$150.00</div>
  </div>
  <div class="summary-item">
    <div class="label">Record</div>
    <div class="value neutral" id="record">0-0</div>
  </div>
  <div class="summary-item">
    <div class="label">P&amp;L</div>
    <div class="value neutral" id="pnl">$0.00</div>

    <div class="label">Expected</div>
    <div class="value neutral" id="expectedPnl">$0.00</div>
  </div>
</div>

<div class="live-summary" id="liveSummary"></div>

<div class="container">
  <div class="last-update" id="lastUpdate">Fetching live scores...</div>
  <div id="bets"></div>
</div>

<div class="footer">
  All bets placed 5/16/2026 @ 9:06 AM &bull; BetDiablo &bull; Scores auto-refresh every 30s
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOe3gjE4xHbL6Px_TzfHI0GbCEQsTTfhA",
  authDomain: "masters-2ef60.firebaseapp.com",
  databaseURL: "https://masters-2ef60-default-rtdb.firebaseio.com",
  projectId: "masters-2ef60",
  storageBucket: "masters-2ef60.firebasestorage.app",
  messagingSenderId: "680427486559",
  appId: "1:680427486559:web:8ab722fcb6a299d44e8aea"
};

// Aronimink GC par total (Round 3 PGA Championship 2026)
const PAR_TOTAL = 70;

// Player name mappings: display name -> possible names in ESPN feed
const PLAYER_LOOKUP = {
  "J Rahm":      ["Jon Rahm", "Rahm"],
  "S Scheffler": ["Scottie Scheffler", "Scheffler"],
  "K Kitayama":  ["Kurt Kitayama", "Kitayama"],
  "P Cantlay":   ["Patrick Cantlay", "Cantlay"],
  "H Matsuyama": ["Hideki Matsuyama", "Matsuyama"],
  "M Woo Lee":   ["Min Woo Lee", "M.W. Lee", "Lee"],
  "A Potgieter": ["Aldrich Potgieter", "Potgieter"],
  "A Smalley":   ["Alex Smalley", "Smalley"],
  "J Thomas":    ["Justin Thomas", "Thomas"]
};

const ROUND = 3; // Round we're tracking
const EVENT_ID = "401811947"; // ESPN event id for 2026 PGA Championship

// Mixed bet types: matchup (head-to-head) and total (round-score over/under)
const bets = [
  { type: "matchup", golfer: "J Rahm",      opponent: "S Scheffler", odds: "+135", risk: 25.00, win: 33.75 },
  { type: "matchup", golfer: "K Kitayama",  opponent: "P Cantlay",   odds: "+110", risk: 25.00, win: 27.50 },
  { type: "matchup", golfer: "H Matsuyama", opponent: "M Woo Lee",   odds: "+110", risk: 25.00, win: 27.50 },
  { type: "matchup", golfer: "A Potgieter", opponent: "A Smalley",   odds: "+135", risk: 25.00, win: 33.75 },
  { type: "total",   golfer: "P Cantlay",   line: 70.5, side: "over", odds: "+115", risk: 25.00, win: 28.75 },
  { type: "total",   golfer: "J Thomas",    line: 70.5, side: "over", odds: "+120", risk: 25.00, win: 30.00 }
];

// Live score state: { golferName: { strokes, toPar, thru } }
let liveScores = {};
let statuses = bets.map(() => "pending");
let lastFetchTime = null;

// Firebase setup
let db = null;
let statusRef = null;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  statusRef = db.ref("pga2026_r3/statuses");

  statusRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
      bets.forEach((_, i) => {
        if (data[i] !== undefined) statuses[i] = data[i];
      });
    }
    render();
  });

  statusRef.once("value", (snapshot) => {
    if (!snapshot.exists()) {
      const seed = {};
      bets.forEach((_, i) => { seed[i] = "pending"; });
      statusRef.set(seed);
    }
  });
} catch(e) {
  console.warn("Firebase init failed:", e);
}

function setStatus(index, status) {
  statuses[index] = status;
  if (statusRef) {
    statusRef.child(String(index)).set(status);
  } else {
    render();
  }
}

function formatScore(s) {
  if (s === null || s === undefined) return "-";
  if (s === 0) return "E";
  return s > 0 ? "+" + s : String(s);
}

function normName(s) {
  return (s || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
}

function findCompetitor(displayName, competitors) {
  const aliases = PLAYER_LOOKUP[displayName] || [displayName];
  for (const c of competitors) {
    const athlete = c.athlete || {};
    const full = athlete.fullName || athlete.displayName || "";
    const last = (full.split(" ").slice(-1)[0]) || "";
    const fullN = normName(full);
    const lastN = normName(last);
    for (const alias of aliases) {
      const a = normName(alias);
      if (fullN === a || lastN === a) return c;
    }
  }
  return null;
}

function parseToPar(dv) {
  if (dv === undefined || dv === null) return null;
  if (dv === "E") return 0;
  if (dv === "-" || dv === "") return null;
  const n = parseFloat(dv);
  return isNaN(n) ? null : n;
}

function getRoundData(competitor, round) {
  const rounds = competitor.linescores || [];
  const roundLs = rounds.find(r => r.period === round);
  if (!roundLs) return { strokes: null, toPar: null, thru: 0 };

  // Sum per-hole linescores while round in progress
  const holes = Array.isArray(roundLs.linescores) ? roundLs.linescores : [];
  let strokes = 0;
  let toPar = 0;
  let thru = 0;
  let haveToPar = false;

  for (const h of holes) {
    const v = parseFloat(h.value);
    if (!v || isNaN(v) || v === 0) break;
    strokes += v;
    const tp = parseToPar(h.scoreType && h.scoreType.displayValue);
    if (tp !== null) { toPar += tp; haveToPar = true; }
    thru++;
  }

  // If we got holes, use them
  if (thru > 0) {
    return { strokes, toPar: haveToPar ? toPar : null, thru };
  }

  // Else fall back to round-level totals (round complete, no hole detail in feed)
  const rv = parseFloat(roundLs.value);
  if (rv > 0) {
    return { strokes: rv, toPar: parseToPar(roundLs.displayValue), thru: 18 };
  }

  return { strokes: null, toPar: null, thru: 0 };
}

async function fetchScores() {
  const badge = document.getElementById("liveBadge");
  badge.textContent = "Updating...";
  badge.className = "live-badge fetching";

  const feedUrl = "https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?event=" + EVENT_ID;

  try {
    let data;
    try {
      const resp = await fetch(feedUrl, { cache: "no-store" });
      data = await resp.json();
    } catch(e) {
      const resp = await fetch("https://corsproxy.io/?url=" + encodeURIComponent(feedUrl), { cache: "no-store" });
      data = await resp.json();
    }

    // Find competitors array
    const events = data.events || [];
    const event = events.find(e => String(e.id) === EVENT_ID) || events[0];
    const competitors = event?.competitions?.[0]?.competitors || [];

    // Collect names we need from all bet types
    const allNames = new Set();
    bets.forEach(b => {
      allNames.add(b.golfer);
      if (b.opponent) allNames.add(b.opponent);
    });

    allNames.forEach(name => {
      const c = findCompetitor(name, competitors);
      if (c) liveScores[name] = getRoundData(c, ROUND);
    });

    // Auto-determine status when round is complete
    bets.forEach((b, i) => {
      const my = liveScores[b.golfer];
      if (!my) return;

      let newStatus = null;
      if (b.type === "matchup") {
        const opp = liveScores[b.opponent];
        if (my.thru === 18 && opp && opp.thru === 18) {
          if (my.toPar !== null && opp.toPar !== null) {
            if (my.toPar < opp.toPar)      newStatus = "won";
            else if (my.toPar > opp.toPar) newStatus = "lost";
            else                           newStatus = "push";
          } else if (my.strokes !== null && opp.strokes !== null) {
            if (my.strokes < opp.strokes)      newStatus = "won";
            else if (my.strokes > opp.strokes) newStatus = "lost";
            else                               newStatus = "push";
          }
        }
      } else if (b.type === "total") {
        if (my.thru === 18 && my.strokes !== null) {
          const over = my.strokes > b.line;
          if (b.side === "over")  newStatus = over ? "won" : "lost";
          if (b.side === "under") newStatus = over ? "lost" : "won";
        }
      }

      if (newStatus && statuses[i] !== newStatus) {
        statuses[i] = newStatus;
        if (statusRef) statusRef.child(String(i)).set(newStatus);
      }
    });

    lastFetchTime = new Date();
    badge.textContent = "Live - Auto-updating";
    badge.className = "live-badge connected";

  } catch(e) {
    console.error("Score fetch failed:", e);
    badge.textContent = "Score fetch failed - retrying";
    badge.className = "live-badge disconnected";
  }

  render();
}

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  // Update timestamp
  if (lastFetchTime) {
    const t = lastFetchTime;
    document.getElementById("lastUpdate").textContent =
      "Last updated: " + t.toLocaleTimeString() + " (auto-refreshes every 30s)";
  }

  let wins = 0, losses = 0, pushes = 0, pnl = 0;
  let liveWinning = 0, liveLosing = 0, liveTied = 0, liveWaiting = 0;
  let expectedPnl = 0;

  const thruText = (thru) => {
    if (thru === null || thru === 0) return "Not started";
    if (thru === 18) return "F";
    return "Thru " + thru;
  };

  bets.forEach((bet, i) => {
    const status = statuses[i];
    if (status === "won")  { wins++;   pnl += bet.win; }
    if (status === "lost") { losses++; pnl -= bet.risk; }
    if (status === "push") { pushes++; }

    const card = document.createElement("div");
    card.className = "bet-card";

    if (bet.type === "matchup") {
      const my = liveScores[bet.golfer] || { strokes: null, toPar: null, thru: 0 };
      const opp = liveScores[bet.opponent] || { strokes: null, toPar: null, thru: 0 };

      // Pick the comparison axis: to-par if available for both, else strokes
      const myCmp = my.toPar !== null ? my.toPar : my.strokes;
      const oppCmp = opp.toPar !== null ? opp.toPar : opp.strokes;
      const haveBoth = myCmp !== null && oppCmp !== null;

      if (haveBoth) {
        if (myCmp < oppCmp)      { liveWinning++; expectedPnl += bet.win; }
        else if (myCmp > oppCmp) { liveLosing++;  expectedPnl -= bet.risk; }
        else                     { liveTied++; }
      } else {
        liveWaiting++;
      }

      let myClass = "tied", oppClass = "tied";
      if (haveBoth) {
        if (myCmp < oppCmp)      { myClass = "winning"; oppClass = "losing"; }
        else if (myCmp > oppCmp) { myClass = "losing";  oppClass = "winning"; }
      }

      const notStarted = (!my.thru) && (!opp.thru);
      const finished = my.thru === 18 && opp.thru === 18;

      let statusClass = status;
      let statusLabel;
      if (notStarted && status === "pending") {
        statusClass = "not_started"; statusLabel = "Not Started";
      } else if (finished) {
        statusLabel = { won: "Winner", lost: "Loss", push: "Push", pending: "Final" }[status];
      } else {
        statusLabel = { pending: "In Progress", won: "Winner", lost: "Loss", push: "Push" }[status];
      }

      card.innerHTML = `
        <div class="card-header">
          <span class="golfer-name">${bet.golfer} <span style="font-size:0.75rem;color:#888">${bet.odds}</span><span class="bet-type-badge">Money Line</span></span>
          <span class="bet-info">Risk $${bet.risk.toFixed(0)} / Win $${bet.win.toFixed(2)}</span>
        </div>
        <div class="matchup-row">
          <div class="matchup-player">
            <div class="mp-label">Your Pick</div>
            <div class="mp-name">${bet.golfer}</div>
            <div class="mp-score ${myClass}">${formatScore(my.toPar)}</div>
            <div class="mp-thru">${thruText(my.thru)}</div>
          </div>
          <div class="matchup-vs-badge">VS</div>
          <div class="matchup-player">
            <div class="mp-label">Opponent</div>
            <div class="mp-name">${bet.opponent}</div>
            <div class="mp-score ${oppClass}">${formatScore(opp.toPar)}</div>
            <div class="mp-thru">${thruText(opp.thru)}</div>
          </div>
        </div>
        <div class="status-bar ${statusClass}">
          <span class="status-dot"></span>
          ${statusLabel}
        </div>
      `;
    } else if (bet.type === "total") {
      const my = liveScores[bet.golfer] || { strokes: null, toPar: null, thru: 0 };

      // Projected stroke total: if we have to-par + thru, project pace; otherwise scale strokes
      let projected = null;
      if (my.thru >= 1 && my.strokes !== null) {
        if (my.toPar !== null) {
          // Use pace-of-to-par: assumes remaining holes finish at par
          projected = Math.round(PAR_TOTAL + (my.toPar / my.thru) * 18);
        } else {
          projected = Math.round((my.strokes / my.thru) * 18);
        }
      }
      const finalStrokes = my.thru === 18 ? my.strokes : null;

      // Determine live winning status using projection vs line
      const winsIfOver = bet.side === "over";
      let liveStatus = null;
      if (finalStrokes !== null) {
        liveStatus = (finalStrokes > bet.line) === winsIfOver ? "winning" : "losing";
      } else if (projected !== null) {
        liveStatus = (projected > bet.line) === winsIfOver ? "winning" : "losing";
      }

      if (liveStatus === "winning")      { liveWinning++; expectedPnl += bet.win; }
      else if (liveStatus === "losing")  { liveLosing++;  expectedPnl -= bet.risk; }
      else                               { liveWaiting++; }

      const notStarted = !my.thru;
      let statusClass = status;
      let statusLabel;
      if (notStarted && status === "pending") {
        statusClass = "not_started"; statusLabel = "Not Started";
      } else if (my.thru === 18) {
        statusLabel = { won: "Winner", lost: "Loss", push: "Push", pending: "Final" }[status];
      } else {
        statusLabel = { pending: "In Progress", won: "Winner", lost: "Loss", push: "Push" }[status];
      }

      const sideLabel = bet.side === "over" ? "Over" : "Under";
      const lineStr = Number.isInteger(bet.line) ? bet.line : bet.line.toString().replace(".5", "½");
      const strokeValueClass =
        liveStatus === "winning" ? "winning" :
        liveStatus === "losing"  ? "losing"  : "tied";

      card.innerHTML = `
        <div class="card-header">
          <span class="golfer-name">${bet.golfer} <span style="font-size:0.75rem;color:#888">${bet.odds}</span><span class="bet-type-badge total">Total</span></span>
          <span class="bet-info">Risk $${bet.risk.toFixed(0)} / Win $${bet.win.toFixed(2)}</span>
        </div>
        <div class="total-row">
          <div class="tr-block">
            <div class="tr-label">R${ROUND} Strokes</div>
            <div class="tr-value ${strokeValueClass}">${my.strokes !== null ? my.strokes : "-"}</div>
            <div class="tr-sub">${thruText(my.thru)}</div>
          </div>
          <div class="tr-block">
            <div class="tr-label">Projected</div>
            <div class="tr-value ${strokeValueClass}">${projected !== null ? projected : "-"}</div>
            <div class="tr-sub">${my.toPar !== null ? formatScore(my.toPar) + " thru " + my.thru : "&nbsp;"}</div>
          </div>
          <div class="tr-block">
            <div class="tr-label">Line</div>
            <div class="tr-value">${sideLabel} ${lineStr}</div>
            <div class="tr-sub">need ${bet.side === "over" ? ">" : "<"} ${bet.line}</div>
          </div>
        </div>
        <div class="status-bar ${statusClass}">
          <span class="status-dot"></span>
          ${statusLabel}
        </div>
      `;
    }

    container.appendChild(card);
  });

  // Live summary bar
  document.getElementById("liveSummary").innerHTML = `
    <div class="ls-item winning">
      <div class="ls-count">${liveWinning}</div>
      <div class="ls-label">Winning</div>
    </div>
    <div class="ls-item losing">
      <div class="ls-count">${liveLosing}</div>
      <div class="ls-label">Losing</div>
    </div>
    <div class="ls-item tied">
      <div class="ls-count">${liveTied}</div>
      <div class="ls-label">Tied</div>
    </div>
    <div class="ls-item waiting">
      <div class="ls-count">${liveWaiting}</div>
      <div class="ls-label">Waiting</div>
    </div>
  `;

  // Expected payout based on current standings
  const expEl = document.getElementById("expectedPnl");
  expEl.textContent = (expectedPnl >= 0 ? "+$" : "-$") + Math.abs(expectedPnl).toFixed(2);
  expEl.className = "value " + (expectedPnl > 0 ? "positive" : expectedPnl < 0 ? "negative" : "neutral");

  document.getElementById("record").textContent =
    `${wins}-${losses}` + (pushes ? `-${pushes}P` : "");

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
  pnlEl.className = "value " + (pnl > 0 ? "positive" : pnl < 0 ? "negative" : "neutral");

  const recEl = document.getElementById("record");
  recEl.className = "value " + (wins > losses ? "positive" : losses > wins ? "negative" : "neutral");
}

// Initial fetch + auto-refresh every 30 seconds
fetchScores();
setInterval(fetchScores, 30000);
</script>

</body>
</html>
