<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masters 2026 - 1v1 Matchup Bets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0a3d0a;
    color: #fff;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0d4f0d 0%, #1a6b1a 100%);
    border-bottom: 4px solid #f4c542;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    font-size: 2rem;
    color: #f4c542;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  header .subtitle {
    color: #c8e6c8;
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 20px;
    background: #062d06;
    border-bottom: 2px solid #1a5c1a;
  }

  .summary-item {
    text-align: center;
  }

  .summary-item .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8cb88c;
    letter-spacing: 1px;
  }

  .summary-item .value {
    font-size: 1.5rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .summary-item .value.positive { color: #4caf50; }
  .summary-item .value.negative { color: #f44336; }
  .summary-item .value.neutral  { color: #f4c542; }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  .bet-card {
    background: #fff;
    color: #222;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }

  .bet-card:hover { transform: translateY(-2px); }

  .bet-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 8px;
  }

  .bet-card .golfer-name {
    font-size: 1.2rem;
    font-weight: bold;
    color: #0d4f0d;
  }

  .bet-card .odds {
    font-size: 1rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 20px;
    background: #e8f5e9;
    color: #2e7d32;
  }

  .bet-card .odds.favorite {
    background: #fff3e0;
    color: #e65100;
  }

  .bet-card .card-body {
    display: flex;
    justify-content: space-between;
    padding: 4px 16px 14px;
    gap: 12px;
  }

  .bet-card .stat {
    text-align: center;
    flex: 1;
  }

  .bet-card .stat .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: #888;
    letter-spacing: 0.5px;
  }

  .bet-card .stat .stat-value {
    font-size: 1.05rem;
    font-weight: bold;
    color: #333;
    margin-top: 2px;
  }

  .bet-card .stat .stat-value.risk { color: #d32f2f; }

  .bet-card .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-size: 0.85rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    gap: 6px;
  }

  .status-bar.pending  { background: #f5f5f5; color: #757575; }
  .status-bar.won      { background: #4caf50; color: #fff; }
  .status-bar.lost     { background: #f44336; color: #fff; }
  .status-bar.push     { background: #ff9800; color: #fff; }

  .status-bar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .status-bar.pending .status-dot  { background: #bbb; }
  .status-bar.won .status-dot      { background: #a5d6a7; }
  .status-bar.lost .status-dot     { background: #ef9a9a; }
  .status-bar.push .status-dot     { background: #ffe0b2; }

  .bet-card .matchup-vs {
    font-size: 0.8rem;
    color: #999;
    padding: 0 16px 6px;
  }

  .footer {
    text-align: center;
    padding: 20px;
    color: #5a8f5a;
    font-size: 0.8rem;
  }

  .edit-hint {
    text-align: center;
    margin-bottom: 16px;
    font-size: 0.8rem;
    color: #8cb88c;
    background: rgba(255,255,255,0.07);
    border-radius: 8px;
    padding: 10px;
  }

  .edit-hint code {
    background: rgba(255,255,255,0.12);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 0.78rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .summary-bar { gap: 16px; }
    .summary-item .value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>The Masters 2026</h1>
  <div class="subtitle">1v1 Matchup Bets &mdash; Round 2 (Fri 4/11)</div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="label">Plays</div>
    <div class="value neutral" id="totalPlays">8</div>
  </div>
  <div class="summary-item">
    <div class="label">Total Risk</div>
    <div class="value neutral" id="totalRisk">$400.00</div>
  </div>
  <div class="summary-item">
    <div class="label">Record</div>
    <div class="value neutral" id="record">0-0</div>
  </div>
  <div class="summary-item">
    <div class="label">P&amp;L</div>
    <div class="value neutral" id="pnl">$0.00</div>
  </div>
</div>

<div class="container">
  <div class="edit-hint">
    Update results by changing <code>status</code> to <code>"won"</code>, <code>"lost"</code>, or <code>"push"</code> in the bets array below.
  </div>
  <div id="bets"></div>
</div>

<div class="footer">
  All bets placed 4/10/2026 @ 8:56 PM &bull; BetDiablo
</div>

<script>
// ========== EDIT BET STATUSES HERE ==========
// Change status to: "pending", "won", "lost", or "push"
const bets = [
  {
    golfer: "M Homa",
    opponent: "Matchup 7328",
    odds: "+100",
    risk: 25.00,
    win: 25.00,
    status: "pending"
  },
  {
    golfer: "L Aberg",
    opponent: "Matchup 7329",
    odds: "+160",
    risk: 50.00,
    win: 80.00,
    status: "pending"
  },
  {
    golfer: "C Young",
    opponent: "Matchup 7336",
    odds: "+105",
    risk: 50.00,
    win: 52.50,
    status: "pending"
  },
  {
    golfer: "B Koepka",
    opponent: "Matchup 7339",
    odds: "-110",
    risk: 50.00,
    win: 45.45,
    status: "pending"
  },
  {
    golfer: "J Day",
    opponent: "Matchup 7341",
    odds: "-120",
    risk: 50.00,
    win: 41.67,
    status: "pending"
  },
  {
    golfer: "S Lowry",
    opponent: "Matchup 7346",
    odds: "+105",
    risk: 75.00,
    win: 78.75,
    status: "pending"
  },
  {
    golfer: "T Fleetwood",
    opponent: "Matchup 7350",
    odds: "-110",
    risk: 50.00,
    win: 45.45,
    status: "pending"
  },
  {
    golfer: "P Reed",
    opponent: "Matchup 7347",
    odds: "-135",
    risk: 50.00,
    win: 37.04,
    status: "pending"
  }
];

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  let wins = 0, losses = 0, pushes = 0, pnl = 0;

  bets.forEach(bet => {
    if (bet.status === "won")  { wins++;   pnl += bet.win; }
    if (bet.status === "lost") { losses++; pnl -= bet.risk; }
    if (bet.status === "push") { pushes++; }

    const isFav = bet.odds.startsWith("-");
    const statusLabel = {
      pending: "In Progress",
      won: "Winner",
      lost: "Loss",
      push: "Push"
    }[bet.status];

    const card = document.createElement("div");
    card.className = "bet-card";
    card.innerHTML = `
      <div class="card-header">
        <span class="golfer-name">${bet.golfer}</span>
        <span class="odds ${isFav ? 'favorite' : ''}">${bet.odds}</span>
      </div>
      <div class="matchup-vs">${bet.opponent}</div>
      <div class="card-body">
        <div class="stat">
          <div class="stat-label">Risk</div>
          <div class="stat-value risk">$${bet.risk.toFixed(2)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">To Win</div>
          <div class="stat-value">$${bet.win.toFixed(2)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Net if Win</div>
          <div class="stat-value" style="color:#2e7d32">+$${bet.win.toFixed(2)}</div>
        </div>
      </div>
      <div class="status-bar ${bet.status}">
        <span class="status-dot"></span>
        ${statusLabel}
      </div>
    `;
    container.appendChild(card);
  });

  // Update summary
  document.getElementById("record").textContent =
    `${wins}-${losses}` + (pushes ? `-${pushes}P` : "");

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
  pnlEl.className = "value " + (pnl > 0 ? "positive" : pnl < 0 ? "negative" : "neutral");

  const recEl = document.getElementById("record");
  recEl.className = "value " + (wins > losses ? "positive" : losses > wins ? "negative" : "neutral");
}

render();
</script>

</body>
</html>
