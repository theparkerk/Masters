<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masters 2026 - 1v1 Matchup Bets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0a3d0a;
    color: #fff;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0d4f0d 0%, #1a6b1a 100%);
    border-bottom: 4px solid #f4c542;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    font-size: 2rem;
    color: #f4c542;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  header .subtitle {
    color: #c8e6c8;
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .connection-status {
    font-size: 0.7rem;
    margin-top: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .connection-status.connected { color: #81c784; }
  .connection-status.disconnected { color: #ef9a9a; }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 20px;
    background: #062d06;
    border-bottom: 2px solid #1a5c1a;
  }

  .summary-item {
    text-align: center;
  }

  .summary-item .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8cb88c;
    letter-spacing: 1px;
  }

  .summary-item .value {
    font-size: 1.5rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .summary-item .value.positive { color: #4caf50; }
  .summary-item .value.negative { color: #f44336; }
  .summary-item .value.neutral  { color: #f4c542; }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  .bet-card {
    background: #fff;
    color: #222;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    transition: transform 0.15s;
  }

  .bet-card:hover { transform: translateY(-2px); }

  .bet-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px 8px;
  }

  .bet-card .golfer-name {
    font-size: 1.2rem;
    font-weight: bold;
    color: #0d4f0d;
  }

  .bet-card .odds {
    font-size: 1rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 20px;
    background: #e8f5e9;
    color: #2e7d32;
  }

  .bet-card .odds.favorite {
    background: #fff3e0;
    color: #e65100;
  }

  .bet-card .card-body {
    display: flex;
    justify-content: space-between;
    padding: 4px 16px 14px;
    gap: 12px;
  }

  .bet-card .stat {
    text-align: center;
    flex: 1;
  }

  .bet-card .stat .stat-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    color: #888;
    letter-spacing: 0.5px;
  }

  .bet-card .stat .stat-value {
    font-size: 1.05rem;
    font-weight: bold;
    color: #333;
    margin-top: 2px;
  }

  .bet-card .stat .stat-value.risk { color: #d32f2f; }

  .bet-card .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    font-size: 0.85rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    gap: 8px;
  }

  .status-bar.pending  { background: #f5f5f5; color: #757575; }
  .status-bar.won      { background: #4caf50; color: #fff; }
  .status-bar.lost     { background: #f44336; color: #fff; }
  .status-bar.push     { background: #ff9800; color: #fff; }

  .status-bar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .status-bar.pending .status-dot  { background: #bbb; }
  .status-bar.won .status-dot      { background: #a5d6a7; }
  .status-bar.lost .status-dot     { background: #ef9a9a; }
  .status-bar.push .status-dot     { background: #ffe0b2; }

  .status-btns {
    display: flex;
    gap: 6px;
    padding: 0 16px 12px;
    justify-content: center;
  }

  .status-btns button {
    border: none;
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 0.72rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s, transform 0.1s;
  }

  .status-btns button:hover { opacity: 0.85; transform: scale(1.05); }
  .status-btns button.active { opacity: 1; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }

  .status-btns .btn-pending { background: #e0e0e0; color: #555; }
  .status-btns .btn-won     { background: #4caf50; color: #fff; }
  .status-btns .btn-lost    { background: #f44336; color: #fff; }
  .status-btns .btn-push    { background: #ff9800; color: #fff; }

  .bet-card .matchup-vs {
    font-size: 0.8rem;
    color: #999;
    padding: 0 16px 6px;
  }

  .footer {
    text-align: center;
    padding: 20px;
    color: #5a8f5a;
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .summary-bar { gap: 16px; }
    .summary-item .value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>The Masters 2026</h1>
  <div class="subtitle">1v1 Matchup Bets &mdash; Round 2 (Fri 4/11)</div>
  <div class="connection-status disconnected" id="connStatus">Connecting...</div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="label">Plays</div>
    <div class="value neutral" id="totalPlays">8</div>
  </div>
  <div class="summary-item">
    <div class="label">Total Risk</div>
    <div class="value neutral" id="totalRisk">$400.00</div>
  </div>
  <div class="summary-item">
    <div class="label">Record</div>
    <div class="value neutral" id="record">0-0</div>
  </div>
  <div class="summary-item">
    <div class="label">P&amp;L</div>
    <div class="value neutral" id="pnl">$0.00</div>
  </div>
</div>

<div class="container">
  <div id="bets"></div>
</div>

<div class="footer">
  All bets placed 4/10/2026 @ 8:56 PM &bull; BetDiablo
</div>

<script>
// =============================================
// FIREBASE CONFIG - PASTE YOUR CONFIG HERE
// =============================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.firebasestorage.app",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
// =============================================

const defaultBets = [
  { golfer: "M Homa",       opponent: "Matchup 7328", odds: "+100",  risk: 25.00, win: 25.00,  status: "pending" },
  { golfer: "L Aberg",      opponent: "Matchup 7329", odds: "+160",  risk: 50.00, win: 80.00,  status: "pending" },
  { golfer: "C Young",      opponent: "Matchup 7336", odds: "+105",  risk: 50.00, win: 52.50,  status: "pending" },
  { golfer: "B Koepka",     opponent: "Matchup 7339", odds: "-110",  risk: 50.00, win: 45.45,  status: "pending" },
  { golfer: "J Day",        opponent: "Matchup 7341", odds: "-120",  risk: 50.00, win: 41.67,  status: "pending" },
  { golfer: "S Lowry",      opponent: "Matchup 7346", odds: "+105",  risk: 75.00, win: 78.75,  status: "pending" },
  { golfer: "T Fleetwood",  opponent: "Matchup 7350", odds: "-110",  risk: 50.00, win: 45.45,  status: "pending" },
  { golfer: "P Reed",       opponent: "Matchup 7347", odds: "-135",  risk: 50.00, win: 37.04,  status: "pending" }
];

let bets = defaultBets.map(b => ({...b}));
let db = null;
let betsRef = null;

// Initialize Firebase
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  betsRef = db.ref("masters2026/statuses");

  // Monitor connection state
  db.ref(".info/connected").on("value", (snap) => {
    const el = document.getElementById("connStatus");
    if (snap.val() === true) {
      el.textContent = "Live";
      el.className = "connection-status connected";
    } else {
      el.textContent = "Offline";
      el.className = "connection-status disconnected";
    }
  });

  // Listen for real-time status changes
  betsRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
      bets.forEach((bet, i) => {
        if (data[i] !== undefined) {
          bet.status = data[i];
        }
      });
    }
    render();
  });

  // Seed default data if none exists
  betsRef.once("value", (snapshot) => {
    if (!snapshot.exists()) {
      const statuses = {};
      defaultBets.forEach((b, i) => { statuses[i] = b.status; });
      betsRef.set(statuses);
    }
  });

} catch(e) {
  console.warn("Firebase init failed, using local-only mode:", e);
  document.getElementById("connStatus").textContent = "Local Only";
  render();
}

function setStatus(index, status) {
  bets[index].status = status;
  if (betsRef) {
    betsRef.child(String(index)).set(status);
  } else {
    render();
  }
}

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  let wins = 0, losses = 0, pushes = 0, pnl = 0;

  bets.forEach((bet, i) => {
    if (bet.status === "won")  { wins++;   pnl += bet.win; }
    if (bet.status === "lost") { losses++; pnl -= bet.risk; }
    if (bet.status === "push") { pushes++; }

    const isFav = bet.odds.startsWith("-");
    const statusLabel = {
      pending: "In Progress",
      won: "Winner",
      lost: "Loss",
      push: "Push"
    }[bet.status];

    const card = document.createElement("div");
    card.className = "bet-card";
    card.innerHTML = `
      <div class="card-header">
        <span class="golfer-name">${bet.golfer}</span>
        <span class="odds ${isFav ? 'favorite' : ''}">${bet.odds}</span>
      </div>
      <div class="matchup-vs">${bet.opponent}</div>
      <div class="card-body">
        <div class="stat">
          <div class="stat-label">Risk</div>
          <div class="stat-value risk">$${bet.risk.toFixed(2)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">To Win</div>
          <div class="stat-value">$${bet.win.toFixed(2)}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Net if Win</div>
          <div class="stat-value" style="color:#2e7d32">+$${bet.win.toFixed(2)}</div>
        </div>
      </div>
      <div class="status-bar ${bet.status}">
        <span class="status-dot"></span>
        ${statusLabel}
      </div>
      <div class="status-btns">
        <button class="btn-pending ${bet.status === 'pending' ? 'active' : ''}" onclick="setStatus(${i},'pending')">Pending</button>
        <button class="btn-won ${bet.status === 'won' ? 'active' : ''}" onclick="setStatus(${i},'won')">Won</button>
        <button class="btn-lost ${bet.status === 'lost' ? 'active' : ''}" onclick="setStatus(${i},'lost')">Lost</button>
        <button class="btn-push ${bet.status === 'push' ? 'active' : ''}" onclick="setStatus(${i},'push')">Push</button>
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById("record").textContent =
    `${wins}-${losses}` + (pushes ? `-${pushes}P` : "");

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
  pnlEl.className = "value " + (pnl > 0 ? "positive" : pnl < 0 ? "negative" : "neutral");

  const recEl = document.getElementById("record");
  recEl.className = "value " + (wins > losses ? "positive" : losses > wins ? "negative" : "neutral");
}
</script>

</body>
</html>
