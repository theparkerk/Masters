<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masters 2026 - 1v1 Matchup Bets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0a3d0a;
    color: #fff;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0d4f0d 0%, #1a6b1a 100%);
    border-bottom: 4px solid #f4c542;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    font-size: 2rem;
    color: #f4c542;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  header .subtitle {
    color: #c8e6c8;
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .connection-status {
    font-size: 0.7rem;
    margin-top: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .connection-status.connected { color: #81c784; }
  .connection-status.disconnected { color: #ef9a9a; }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 20px;
    background: #062d06;
    border-bottom: 2px solid #1a5c1a;
  }

  .summary-item {
    text-align: center;
  }

  .summary-item .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8cb88c;
    letter-spacing: 1px;
  }

  .summary-item .value {
    font-size: 1.5rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .summary-item .value.positive { color: #4caf50; }
  .summary-item .value.negative { color: #f44336; }
  .summary-item .value.neutral  { color: #f4c542; }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  .bet-card {
    background: #fff;
    color: #222;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }

  .bet-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 4px;
  }

  .bet-card .golfer-name {
    font-size: 1.15rem;
    font-weight: bold;
    color: #0d4f0d;
  }

  .bet-card .odds {
    font-size: 0.9rem;
    font-weight: bold;
    padding: 3px 10px;
    border-radius: 20px;
    background: #e8f5e9;
    color: #2e7d32;
  }

  .bet-card .odds.favorite {
    background: #fff3e0;
    color: #e65100;
  }

  .matchup-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 16px;
    gap: 10px;
    background: #f8f9fa;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
  }

  .matchup-player {
    flex: 1;
    text-align: center;
  }

  .matchup-player .mp-name {
    font-size: 0.85rem;
    font-weight: bold;
    color: #333;
  }

  .matchup-player .mp-score {
    font-size: 1.4rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .matchup-player .mp-score.winning { color: #2e7d32; }
  .matchup-player .mp-score.losing  { color: #c62828; }
  .matchup-player .mp-score.tied    { color: #f57f17; }

  .matchup-player .mp-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #999;
    letter-spacing: 0.5px;
  }

  .matchup-vs-badge {
    font-size: 0.75rem;
    font-weight: bold;
    color: #999;
    padding: 0 4px;
  }

  .bet-card .card-body {
    display: flex;
    justify-content: space-between;
    padding: 8px 16px 10px;
    gap: 12px;
  }

  .bet-card .stat {
    text-align: center;
    flex: 1;
  }

  .bet-card .stat .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    color: #888;
    letter-spacing: 0.5px;
  }

  .bet-card .stat .stat-value {
    font-size: 0.95rem;
    font-weight: bold;
    color: #333;
    margin-top: 2px;
  }

  .bet-card .stat .stat-value.risk { color: #d32f2f; }

  .bet-card .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    gap: 6px;
  }

  .status-bar.pending  { background: #f5f5f5; color: #757575; }
  .status-bar.won      { background: #4caf50; color: #fff; }
  .status-bar.lost     { background: #f44336; color: #fff; }
  .status-bar.push     { background: #ff9800; color: #fff; }

  .status-bar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .status-bar.pending .status-dot  { background: #bbb; }
  .status-bar.won .status-dot      { background: #a5d6a7; }
  .status-bar.lost .status-dot     { background: #ef9a9a; }
  .status-bar.push .status-dot     { background: #ffe0b2; }

  .status-btns {
    display: flex;
    gap: 6px;
    padding: 0 16px 10px;
    justify-content: center;
  }

  .status-btns button {
    border: none;
    padding: 5px 14px;
    border-radius: 16px;
    font-size: 0.72rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s, transform 0.1s;
  }

  .status-btns button:hover { opacity: 0.85; transform: scale(1.05); }
  .status-btns button.active { opacity: 1; box-shadow: 0 2px 6px rgba(0,0,0,0.25); }

  .status-btns .btn-pending { background: #e0e0e0; color: #555; }
  .status-btns .btn-won     { background: #4caf50; color: #fff; }
  .status-btns .btn-lost    { background: #f44336; color: #fff; }
  .status-btns .btn-push    { background: #ff9800; color: #fff; }

  .footer {
    text-align: center;
    padding: 20px;
    color: #5a8f5a;
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .summary-bar { gap: 16px; }
    .summary-item .value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>The Masters 2026</h1>
  <div class="subtitle">1v1 Matchup Bets &mdash; Round 2 (Fri 4/11)</div>
  <div class="connection-status disconnected" id="connStatus">Connecting...</div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="label">Plays</div>
    <div class="value neutral" id="totalPlays">8</div>
  </div>
  <div class="summary-item">
    <div class="label">Total Risk</div>
    <div class="value neutral" id="totalRisk">$400.00</div>
  </div>
  <div class="summary-item">
    <div class="label">Record</div>
    <div class="value neutral" id="record">0-0</div>
  </div>
  <div class="summary-item">
    <div class="label">P&amp;L</div>
    <div class="value neutral" id="pnl">$0.00</div>
  </div>
</div>

<div class="container">
  <div id="bets"></div>
</div>

<div class="footer">
  All bets placed 4/10/2026 @ 8:56 PM &bull; BetDiablo
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOe3gjE4xHbL6Px_TzfHI0GbCEQsTTfhA",
  authDomain: "masters-2ef60.firebaseapp.com",
  databaseURL: "https://masters-2ef60-default-rtdb.firebaseio.com",
  projectId: "masters-2ef60",
  storageBucket: "masters-2ef60.firebasestorage.app",
  messagingSenderId: "680427486559",
  appId: "1:680427486559:web:8ab722fcb6a299d44e8aea"
};

const defaultBets = [
  { golfer: "M Homa",       opponent: "TBD",          odds: "+100",  risk: 25.00, win: 25.00,  status: "pending", myScore: 70, oppScore: null },
  { golfer: "L Aberg",      opponent: "TBD",          odds: "+160",  risk: 50.00, win: 80.00,  status: "pending", myScore: 70, oppScore: null },
  { golfer: "C Young",      opponent: "TBD",          odds: "+105",  risk: 50.00, win: 52.50,  status: "pending", myScore: 67, oppScore: null },
  { golfer: "B Koepka",     opponent: "C Gotterup",   odds: "-110",  risk: 50.00, win: 45.45,  status: "push",    myScore: 69, oppScore: 69 },
  { golfer: "J Day",        opponent: "T Hatton",     odds: "-120",  risk: 50.00, win: 41.67,  status: "lost",    myScore: 71, oppScore: 66 },
  { golfer: "S Lowry",      opponent: "J Rose",       odds: "+105",  risk: 75.00, win: 78.75,  status: "push",    myScore: 69, oppScore: 69 },
  { golfer: "T Fleetwood",  opponent: "R McIlroy",    odds: "-110",  risk: 50.00, win: 45.45,  status: "lost",    myScore: 68, oppScore: 65 },
  { golfer: "P Reed",       opponent: "S Burns",      odds: "-135",  risk: 50.00, win: 37.04,  status: "won",     myScore: 69, oppScore: 71 }
];

let bets = defaultBets.map(b => ({...b}));
let db = null;
let betsRef = null;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  betsRef = db.ref("masters2026/bets");

  db.ref(".info/connected").on("value", (snap) => {
    const el = document.getElementById("connStatus");
    if (snap.val() === true) {
      el.textContent = "Live";
      el.className = "connection-status connected";
    } else {
      el.textContent = "Offline";
      el.className = "connection-status disconnected";
    }
  });

  betsRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
      bets.forEach((bet, i) => {
        if (data[i]) {
          if (data[i].status !== undefined) bet.status = data[i].status;
          if (data[i].myScore !== undefined) bet.myScore = data[i].myScore;
          if (data[i].oppScore !== undefined) bet.oppScore = data[i].oppScore;
        }
      });
    }
    render();
  });

  betsRef.once("value", (snapshot) => {
    if (!snapshot.exists()) {
      const seed = {};
      defaultBets.forEach((b, i) => {
        seed[i] = { status: b.status, myScore: b.myScore, oppScore: b.oppScore };
      });
      betsRef.set(seed);
    }
  });

} catch(e) {
  console.warn("Firebase init failed:", e);
  document.getElementById("connStatus").textContent = "Local Only";
  render();
}

function setStatus(index, status) {
  bets[index].status = status;
  if (betsRef) {
    betsRef.child(String(index)).update({ status: status });
  } else {
    render();
  }
}

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  let wins = 0, losses = 0, pushes = 0, pnl = 0;

  bets.forEach((bet, i) => {
    if (bet.status === "won")  { wins++;   pnl += bet.win; }
    if (bet.status === "lost") { losses++; pnl -= bet.risk; }
    if (bet.status === "push") { pushes++; }

    const isFav = bet.odds.startsWith("-");
    const statusLabel = {
      pending: "In Progress",
      won: "Winner",
      lost: "Loss",
      push: "Push"
    }[bet.status];

    const myS = bet.myScore;
    const opS = bet.oppScore;
    let myClass = "tied", opClass = "tied";
    if (myS !== null && opS !== null) {
      if (myS < opS)      { myClass = "winning"; opClass = "losing"; }
      else if (myS > opS) { myClass = "losing";  opClass = "winning"; }
    }

    const card = document.createElement("div");
    card.className = "bet-card";
    card.innerHTML = `
      <div class="card-header">
        <span class="golfer-name">${bet.golfer} <span style="font-size:0.75rem;color:#888">${bet.odds}</span></span>
        <span class="odds ${isFav ? 'favorite' : ''}" style="font-size:0.8rem">Risk $${bet.risk.toFixed(0)} / Win $${bet.win.toFixed(2)}</span>
      </div>
      <div class="matchup-row">
        <div class="matchup-player">
          <div class="mp-label">Your Pick</div>
          <div class="mp-name">${bet.golfer}</div>
          <div class="mp-score ${myClass}">${myS !== null ? myS : '-'}</div>
        </div>
        <div class="matchup-vs-badge">VS</div>
        <div class="matchup-player">
          <div class="mp-label">Opponent</div>
          <div class="mp-name">${bet.opponent}</div>
          <div class="mp-score ${opClass}">${opS !== null ? opS : '-'}</div>
        </div>
      </div>
      <div class="status-bar ${bet.status}">
        <span class="status-dot"></span>
        ${statusLabel}
      </div>
      <div class="status-btns">
        <button class="btn-pending ${bet.status === 'pending' ? 'active' : ''}" onclick="setStatus(${i},'pending')">Pending</button>
        <button class="btn-won ${bet.status === 'won' ? 'active' : ''}" onclick="setStatus(${i},'won')">Won</button>
        <button class="btn-lost ${bet.status === 'lost' ? 'active' : ''}" onclick="setStatus(${i},'lost')">Lost</button>
        <button class="btn-push ${bet.status === 'push' ? 'active' : ''}" onclick="setStatus(${i},'push')">Push</button>
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById("record").textContent =
    `${wins}-${losses}` + (pushes ? `-${pushes}P` : "");

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
  pnlEl.className = "value " + (pnl > 0 ? "positive" : pnl < 0 ? "negative" : "neutral");

  const recEl = document.getElementById("record");
  recEl.className = "value " + (wins > losses ? "positive" : losses > wins ? "negative" : "neutral");
}
</script>

</body>
</html>
