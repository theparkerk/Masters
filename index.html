<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masters 2026 - 1v1 Matchup Bets</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛳</text></svg>">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Georgia', serif;
    background: #0a3d0a;
    color: #fff;
    min-height: 100vh;
  }

  header {
    background: linear-gradient(135deg, #0d4f0d 0%, #1a6b1a 100%);
    border-bottom: 4px solid #f4c542;
    padding: 20px;
    text-align: center;
  }

  header h1 {
    font-size: 2rem;
    color: #f4c542;
    text-transform: uppercase;
    letter-spacing: 3px;
  }

  header .subtitle {
    color: #c8e6c8;
    font-size: 0.95rem;
    margin-top: 4px;
  }

  .live-badge {
    display: inline-block;
    font-size: 0.65rem;
    margin-top: 6px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 10px;
  }

  .live-badge.connected { background: #2e7d32; color: #fff; }
  .live-badge.disconnected { background: #c62828; color: #fff; }
  .live-badge.fetching { background: #f57f17; color: #fff; }

  .summary-bar {
    display: flex;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 20px;
    background: #062d06;
    border-bottom: 2px solid #1a5c1a;
  }

  .summary-item { text-align: center; }

  .summary-item .label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: #8cb88c;
    letter-spacing: 1px;
  }

  .summary-item .value {
    font-size: 1.5rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .summary-item .value.positive { color: #4caf50; }
  .summary-item .value.negative { color: #f44336; }
  .summary-item .value.neutral  { color: #f4c542; }

  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 20px 16px;
  }

  .last-update {
    text-align: center;
    font-size: 0.7rem;
    color: #6a9f6a;
    margin-bottom: 12px;
  }

  .bet-card {
    background: #fff;
    color: #222;
    border-radius: 10px;
    margin-bottom: 14px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
  }

  .bet-card .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px 4px;
  }

  .bet-card .golfer-name {
    font-size: 1.15rem;
    font-weight: bold;
    color: #0d4f0d;
  }

  .bet-card .bet-info {
    font-size: 0.78rem;
    font-weight: bold;
    color: #888;
  }

  .matchup-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 12px;
    gap: 6px;
    background: #f8f9fa;
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
  }

  .matchup-player {
    flex: 1;
    text-align: center;
  }

  .matchup-player .mp-name {
    font-size: 0.82rem;
    font-weight: bold;
    color: #333;
  }

  .matchup-player .mp-score {
    font-size: 1.5rem;
    font-weight: bold;
    margin-top: 2px;
  }

  .matchup-player .mp-thru {
    font-size: 0.62rem;
    color: #999;
    margin-top: 1px;
  }

  .matchup-player .mp-score.winning { color: #2e7d32; }
  .matchup-player .mp-score.losing  { color: #c62828; }
  .matchup-player .mp-score.tied    { color: #f57f17; }

  .matchup-player .mp-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    color: #999;
    letter-spacing: 0.5px;
  }

  .matchup-vs-badge {
    font-size: 0.7rem;
    font-weight: bold;
    color: #bbb;
    padding: 0 2px;
    flex-shrink: 0;
  }

  .bet-card .status-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 1px;
    gap: 6px;
  }

  .status-bar.pending  { background: #f5f5f5; color: #757575; }
  .status-bar.won      { background: #4caf50; color: #fff; }
  .status-bar.lost     { background: #f44336; color: #fff; }
  .status-bar.push     { background: #ff9800; color: #fff; }
  .status-bar.not_started { background: #e3f2fd; color: #1565c0; }

  .status-bar .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
  }

  .status-bar.pending .status-dot    { background: #bbb; }
  .status-bar.won .status-dot        { background: #a5d6a7; }
  .status-bar.lost .status-dot       { background: #ef9a9a; }
  .status-bar.push .status-dot       { background: #ffe0b2; }
  .status-bar.not_started .status-dot { background: #90caf9; }

  .footer {
    text-align: center;
    padding: 20px;
    color: #5a8f5a;
    font-size: 0.8rem;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .summary-bar { gap: 16px; }
    .summary-item .value { font-size: 1.2rem; }
  }
</style>
</head>
<body>

<header>
  <h1>The Masters 2026</h1>
  <div class="subtitle">Round 3 Matchup Bets &mdash; Sat 4/11</div>
  <div class="live-badge disconnected" id="liveBadge">Connecting...</div>
</header>

<div class="summary-bar">
  <div class="summary-item">
    <div class="label">Plays</div>
    <div class="value neutral" id="totalPlays">8</div>
  </div>
  <div class="summary-item">
    <div class="label">Total Risk</div>
    <div class="value neutral" id="totalRisk">$400.00</div>
  </div>
  <div class="summary-item">
    <div class="label">Record</div>
    <div class="value neutral" id="record">0-0</div>
  </div>
  <div class="summary-item">
    <div class="label">P&amp;L</div>
    <div class="value neutral" id="pnl">$0.00</div>
  </div>
</div>

<div class="container">
  <div class="last-update" id="lastUpdate">Fetching live scores...</div>
  <div id="bets"></div>
</div>

<div class="footer">
  All bets placed 4/10/2026 @ 8:56 PM &bull; BetDiablo &bull; Scores auto-refresh every 30s
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAOe3gjE4xHbL6Px_TzfHI0GbCEQsTTfhA",
  authDomain: "masters-2ef60.firebaseapp.com",
  databaseURL: "https://masters-2ef60-default-rtdb.firebaseio.com",
  projectId: "masters-2ef60",
  storageBucket: "masters-2ef60.firebasestorage.app",
  messagingSenderId: "680427486559",
  appId: "1:680427486559:web:8ab722fcb6a299d44e8aea"
};

// Augusta National par for each hole
const PAR = [4,5,4,3,4,3,4,5,4, 4,4,3,5,4,5,3,4,4]; // holes 1-18

// Player name mappings: display name -> possible names in masters.com feed
const PLAYER_LOOKUP = {
  "M Homa":       ["Max Homa", "Homa"],
  "L Aberg":      ["Ludvig Åberg", "Ludvig Aberg", "Åberg", "Aberg"],
  "C Young":      ["Cameron Young", "Young"],
  "B Koepka":     ["Brooks Koepka", "Koepka"],
  "J Day":        ["Jason Day", "Day"],
  "S Lowry":      ["Shane Lowry", "Lowry"],
  "T Fleetwood":  ["Tommy Fleetwood", "Fleetwood"],
  "P Reed":       ["Patrick Reed", "Reed"],
  "R Gerard":     ["Robert Gerard", "Bob Gerard", "Gerard"],
  "S Scheffler":  ["Scottie Scheffler", "Scheffler"],
  "X Schauffele": ["Xander Schauffele", "Schauffele"],
  "C Gotterup":   ["Chris Gotterup", "Gotterup"],
  "T Hatton":     ["Tyrrell Hatton", "Hatton"],
  "J Rose":       ["Justin Rose", "Rose"],
  "R McIlroy":    ["Rory McIlroy", "McIlroy"],
  "S Burns":      ["Sam Burns", "Burns"]
};

const ROUND = 3; // Round we're tracking

const matchups = [
  { golfer: "M Homa",       opponent: "R Gerard",     odds: "+100", risk: 25.00, win: 25.00  },
  { golfer: "L Aberg",      opponent: "S Scheffler",  odds: "+160", risk: 50.00, win: 80.00  },
  { golfer: "C Young",      opponent: "X Schauffele", odds: "+105", risk: 50.00, win: 52.50  },
  { golfer: "B Koepka",     opponent: "C Gotterup",   odds: "-110", risk: 50.00, win: 45.45  },
  { golfer: "J Day",        opponent: "T Hatton",     odds: "-120", risk: 50.00, win: 41.67  },
  { golfer: "S Lowry",      opponent: "J Rose",       odds: "+105", risk: 75.00, win: 78.75  },
  { golfer: "T Fleetwood",  opponent: "R McIlroy",    odds: "-110", risk: 50.00, win: 45.45  },
  { golfer: "P Reed",       opponent: "S Burns",      odds: "-135", risk: 50.00, win: 37.04  }
];

// Live score state
let liveScores = {}; // keyed by display name, e.g. { "M Homa": { score: -2, thru: 12 }, ... }
let statuses = matchups.map(() => "pending");
let lastFetchTime = null;

// Firebase setup
let db = null;
let statusRef = null;

try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  statusRef = db.ref("masters2026_r3/statuses");

  statusRef.on("value", (snapshot) => {
    const data = snapshot.val();
    if (data) {
      matchups.forEach((_, i) => {
        if (data[i] !== undefined) statuses[i] = data[i];
      });
    }
    render();
  });

  statusRef.once("value", (snapshot) => {
    if (!snapshot.exists()) {
      const seed = {};
      matchups.forEach((_, i) => { seed[i] = "pending"; });
      statusRef.set(seed);
    }
  });
} catch(e) {
  console.warn("Firebase init failed:", e);
}

function setStatus(index, status) {
  statuses[index] = status;
  if (statusRef) {
    statusRef.child(String(index)).set(status);
  } else {
    render();
  }
}

function formatScore(s) {
  if (s === null || s === undefined) return "-";
  if (s === 0) return "E";
  return s > 0 ? "+" + s : String(s);
}

function findPlayer(displayName, players) {
  const aliases = PLAYER_LOOKUP[displayName] || [displayName];
  for (const player of players) {
    const fullName = (player.first_name || "") + " " + (player.last_name || "");
    const lastName = player.last_name || "";
    for (const alias of aliases) {
      if (fullName === alias || lastName === alias ||
          fullName.normalize("NFD").replace(/[\u0300-\u036f]/g, "") === alias ||
          lastName.normalize("NFD").replace(/[\u0300-\u036f]/g, "") === alias) {
        return player;
      }
    }
  }
  return null;
}

function calcRoundScore(player) {
  const roundKey = "round" + ROUND;
  const roundData = player[roundKey];
  if (!roundData) return { score: null, thru: null };

  const holes = roundData.holes || [];
  if (!holes.length) return { score: null, thru: 0 };

  let toPar = 0;
  let holesPlayed = 0;

  for (let h = 0; h < holes.length; h++) {
    const holeScore = parseInt(holes[h]);
    if (isNaN(holeScore) || holeScore === 0) break;
    toPar += holeScore - PAR[h];
    holesPlayed++;
  }

  if (holesPlayed === 0) return { score: null, thru: 0 };
  return { score: toPar, thru: holesPlayed };
}

async function fetchScores() {
  const badge = document.getElementById("liveBadge");
  badge.textContent = "Updating...";
  badge.className = "live-badge fetching";

  try {
    // Try direct fetch first
    let data;
    try {
      const resp = await fetch("https://www.masters.com/en_US/scores/feeds/2026/scores.json", { cache: "no-store" });
      data = await resp.json();
    } catch(e) {
      // Fallback: CORS proxy
      const resp = await fetch("https://corsproxy.io/?url=" + encodeURIComponent("https://www.masters.com/en_US/scores/feeds/2026/scores.json"), { cache: "no-store" });
      data = await resp.json();
    }

    const players = data.data?.player || data.player || [];
    if (!players.length && data.data) {
      // Try alternate structure
      for (const key of Object.keys(data.data)) {
        if (Array.isArray(data.data[key])) {
          players.push(...data.data[key]);
          break;
        }
      }
    }

    // Build all names we need to look up
    const allNames = new Set();
    matchups.forEach(m => { allNames.add(m.golfer); allNames.add(m.opponent); });

    allNames.forEach(name => {
      const player = findPlayer(name, players);
      if (player) {
        const result = calcRoundScore(player);
        liveScores[name] = result;
      }
    });

    // Auto-determine status when both players finished 18 holes
    matchups.forEach((m, i) => {
      const my = liveScores[m.golfer];
      const opp = liveScores[m.opponent];
      if (my && opp && my.thru === 18 && opp.thru === 18) {
        let newStatus;
        if (my.score < opp.score) newStatus = "won";
        else if (my.score > opp.score) newStatus = "lost";
        else newStatus = "push";

        if (statuses[i] !== newStatus) {
          statuses[i] = newStatus;
          if (statusRef) statusRef.child(String(i)).set(newStatus);
        }
      }
    });

    lastFetchTime = new Date();
    badge.textContent = "Live - Auto-updating";
    badge.className = "live-badge connected";

  } catch(e) {
    console.error("Score fetch failed:", e);
    badge.textContent = "Score fetch failed - retrying";
    badge.className = "live-badge disconnected";
  }

  render();
}

function render() {
  const container = document.getElementById("bets");
  container.innerHTML = "";

  // Update timestamp
  if (lastFetchTime) {
    const t = lastFetchTime;
    document.getElementById("lastUpdate").textContent =
      "Last updated: " + t.toLocaleTimeString() + " (auto-refreshes every 30s)";
  }

  let wins = 0, losses = 0, pushes = 0, pnl = 0;

  matchups.forEach((bet, i) => {
    const status = statuses[i];
    if (status === "won")  { wins++;   pnl += bet.win; }
    if (status === "lost") { losses++; pnl -= bet.risk; }
    if (status === "push") { pushes++; }

    const my = liveScores[bet.golfer] || { score: null, thru: null };
    const opp = liveScores[bet.opponent] || { score: null, thru: null };

    let myClass = "tied", oppClass = "tied";
    if (my.score !== null && opp.score !== null) {
      if (my.score < opp.score)      { myClass = "winning"; oppClass = "losing"; }
      else if (my.score > opp.score) { myClass = "losing";  oppClass = "winning"; }
    }

    const notStarted = (my.thru === 0 || my.thru === null) && (opp.thru === 0 || opp.thru === null);
    const finished = my.thru === 18 && opp.thru === 18;

    let statusClass = status;
    let statusLabel;
    if (notStarted && status === "pending") {
      statusClass = "not_started";
      statusLabel = "Not Started";
    } else if (finished) {
      statusLabel = { won: "Winner", lost: "Loss", push: "Push", pending: "Final" }[status];
    } else {
      statusLabel = { pending: "In Progress", won: "Winner", lost: "Loss", push: "Push" }[status];
    }

    const thruText = (thru) => {
      if (thru === null || thru === 0) return "Not started";
      if (thru === 18) return "F";
      return "Thru " + thru;
    };

    const card = document.createElement("div");
    card.className = "bet-card";
    card.innerHTML = `
      <div class="card-header">
        <span class="golfer-name">${bet.golfer} <span style="font-size:0.75rem;color:#888">${bet.odds}</span></span>
        <span class="bet-info">Risk $${bet.risk.toFixed(0)} / Win $${bet.win.toFixed(2)}</span>
      </div>
      <div class="matchup-row">
        <div class="matchup-player">
          <div class="mp-label">Your Pick</div>
          <div class="mp-name">${bet.golfer}</div>
          <div class="mp-score ${myClass}">${formatScore(my.score)}</div>
          <div class="mp-thru">${thruText(my.thru)}</div>
        </div>
        <div class="matchup-vs-badge">VS</div>
        <div class="matchup-player">
          <div class="mp-label">Opponent</div>
          <div class="mp-name">${bet.opponent}</div>
          <div class="mp-score ${oppClass}">${formatScore(opp.score)}</div>
          <div class="mp-thru">${thruText(opp.thru)}</div>
        </div>
      </div>
      <div class="status-bar ${statusClass}">
        <span class="status-dot"></span>
        ${statusLabel}
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById("record").textContent =
    `${wins}-${losses}` + (pushes ? `-${pushes}P` : "");

  const pnlEl = document.getElementById("pnl");
  pnlEl.textContent = (pnl >= 0 ? "+$" : "-$") + Math.abs(pnl).toFixed(2);
  pnlEl.className = "value " + (pnl > 0 ? "positive" : pnl < 0 ? "negative" : "neutral");

  const recEl = document.getElementById("record");
  recEl.className = "value " + (wins > losses ? "positive" : losses > wins ? "negative" : "neutral");
}

// Initial fetch + auto-refresh every 30 seconds
fetchScores();
setInterval(fetchScores, 30000);
</script>

</body>
</html>
